<!doctype html>
<html lang="en" class="dark" style="background-color: #121212; color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Modern, self-hostable music streaming & offline music platform" />
    <link rel="manifest" href="/manifest.json" />
    <title>MyMusic - Stream & Discover</title>
    <style>
      html, body {
        background-color: #121212 !important;
        color: #ffffff !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="bg-[#121212] text-neutral-200 antialiased selection:bg-primary selection:text-primary-foreground min-h-screen">
    <div id="root">
      <!-- Loading fallback while React bundle initializes -->
      <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background-color:#121212;color:#22c55e;font-family:sans-serif;">
        <div style="text-align:center;">
          <svg style="width:48px;height:48px;animation:spin 2s linear infinite;margin:0 auto 16px auto;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.25"></circle>
            <path d="M12 2a10 10 0 0 1 10 10" stroke="#22c55e" stroke-linecap="round"></path>
          </svg>
          <div style="font-size:14px;color:#a3a3a3;font-weight:600;">Loading MyMusic...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clear stale service worker caches on localhost
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var registration of registrations) {
              registration.unregister();
            }
          });
        } else if (window.location.protocol.startsWith('http')) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
