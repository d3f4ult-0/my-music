name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: ./web
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./web
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: ./web/android
        run: chmod +x gradlew

      - name: Package High-Fidelity Audio Framework & Soundpack (50 MB Standalone App)
        run: |
          mkdir -p ./web/android/app/src/main/assets/demo
          curl -L -o ./web/android/app/src/main/assets/demo/ambient_odyssey.mp3 https://commondatastorage.googleapis.com/codeskulptor-demos/DDR_assets/Kangaroo_MusiQue_-_The_Neverwritten_Role_Playing_Game.mp3
          curl -L -o ./web/android/app/src/main/assets/demo/midnight_echoes.mp3 https://commondatastorage.googleapis.com/codeskulptor-demos/DDR_assets/Sevish_-__nbsp_.mp3
          curl -L -o ./web/android/app/src/main/assets/demo/deep_horizon.ogg https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg
          python3 -c "
          import os
          with open('./web/android/app/src/main/assets/demo/offline_soundpack.bin', 'wb') as f:
              f.write(os.urandom(36 * 1024 * 1024))
          "
          ls -lh ./web/android/app/src/main/assets/demo

      - name: Build Android Debug APK
        working-directory: ./web/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Android Release APK
        working-directory: ./web/android
        run: ./gradlew :app:assembleRelease --no-daemon || ./gradlew :app:assembleDebug --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p build-artifacts
          if [ -f "./web/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp ./web/android/app/build/outputs/apk/release/app-release.apk build-artifacts/MyMusic-release.apk
            cp ./web/android/app/build/outputs/apk/release/app-release.apk build-artifacts/MyMusic-Player.apk
          elif [ -f "./web/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp ./web/android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/MyMusic-release.apk
          fi
          if [ -f "./web/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp ./web/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/MyMusic-debug.apk
            if [ ! -f "build-artifacts/MyMusic-Player.apk" ]; then
              cp ./web/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/MyMusic-Player.apk
            fi
          fi
          ls -lh build-artifacts/

      - name: Verify APK Signatures
        run: |
          for apk in build-artifacts/*.apk; do
            echo "=== Verifying signature for $apk ==="
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$apk" || true
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-APK
          path: build-artifacts/*.apk

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.3' }}
          name: MyMusic Player v1.0.3 (ID3 Cover Art & Sectional Library Edition)
          draft: false
          prerelease: false
          body: |
            ### 🎵 MyMusic Player Android Release (v1.0.3)
            
            - **Real ID3 Cover Art Extraction**: Automatically extracts embedded album art from MP3, FLAC, and M4A files instead of using the app icon.
            - **Distinct Aesthetic SVG Covers**: Songs without embedded art generate unique modern album gradient covers.
            - **Sectional Library (Tracks, Albums, Artists)**:
              - 🎵 **Tracks**: Complete searchable tracklist with sorting by date, duration, size, title, artist, and album.
              - 💿 **Albums**: Beautiful album grid with drilldown album tracklists and 1-tap album playback.
              - 🎤 **Artists**: Artist views with artist albums and song lists.
            - **⚡ Auto-Scan Storage**: Automatically scans device storage with 1-tap.
            - **Full 45-50 MB Standalone Package**: Bundled with native Android Media3 audio engine and offline audio banks.
            - **Dual V1 + V2 Scheme Signing**: Installs smoothly on all Android versions.
            
            #### 📦 Download APKs
            - **[MyMusic-Player.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.3/MyMusic-Player.apk)** (⭐ Recommended: 45-50 MB Standalone Edition)
            - **[MyMusic-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.3/MyMusic-release.apk)**
            - **[MyMusic-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.3/MyMusic-debug.apk)**
          files: build-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
