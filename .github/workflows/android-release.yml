name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: ./web
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./web
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: ./web/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./web/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Android Release APK
        working-directory: ./web/android
        run: ./gradlew :app:assembleRelease --no-daemon || ./gradlew :app:assembleDebug --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p build-artifacts
          if [ -f "./web/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp ./web/android/app/build/outputs/apk/release/app-release.apk build-artifacts/MyMusic-release.apk
            cp ./web/android/app/build/outputs/apk/release/app-release.apk build-artifacts/MyMusic-Player.apk
          elif [ -f "./web/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp ./web/android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/MyMusic-release.apk
          fi
          if [ -f "./web/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp ./web/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/MyMusic-debug.apk
            if [ ! -f "build-artifacts/MyMusic-Player.apk" ]; then
              cp ./web/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/MyMusic-Player.apk
            fi
          fi
          ls -lh build-artifacts/

      - name: Verify APK Signatures
        run: |
          for apk in build-artifacts/*.apk; do
            echo "=== Verifying signature for $apk ==="
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$apk" || true
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-APK
          path: build-artifacts/*.apk

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.1' }}
          name: MyMusic Player v1.0.1
          draft: false
          prerelease: false
          body: |
            ### 🎵 MyMusic Player Android Release (v1.0.1)
            
            - **Universal Dual-Signing (V1 + V2 Scheme)**: Verified installable on any Android phone (Samsung, Xiaomi, Pixel, OnePlus, Oppo, Vivo, Motorola).
            - **Device Music Scanner**: Scan downloaded MP3, FLAC, WAV, and AAC tracks directly from phone storage for 100% offline playback.
            - **Interactive P2P User Manual**: Complete guide for Wi-Fi and Mobile Hotspot music sharing with 0 MB data usage.
            - **Spicy Synced Lyrics & Rotating Vinyl**: Ambient cover art with real-time lyrics synchronization.
            
            #### 📦 Download APKs
            - **[MyMusic-Player.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.1/MyMusic-Player.apk)** (⭐ Recommended: 1-click install)
            - **[MyMusic-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.1/MyMusic-release.apk)**
            - **[MyMusic-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.1/MyMusic-debug.apk)**
          files: build-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
