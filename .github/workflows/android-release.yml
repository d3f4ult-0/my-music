name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: ./web
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./web
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: ./web/android
        run: chmod +x gradlew

      - name: Package High-Fidelity Audio Framework & Soundpack (50 MB Standalone App)
        run: |
          mkdir -p ./web/android/app/src/main/assets/demo
          curl -L -o ./web/android/app/src/main/assets/demo/ambient_odyssey.mp3 https://commondatastorage.googleapis.com/codeskulptor-demos/DDR_assets/Kangaroo_MusiQue_-_The_Neverwritten_Role_Playing_Game.mp3
          curl -L -o ./web/android/app/src/main/assets/demo/midnight_echoes.mp3 https://commondatastorage.googleapis.com/codeskulptor-demos/DDR_assets/Sevish_-__nbsp_.mp3
          curl -L -o ./web/android/app/src/main/assets/demo/deep_horizon.ogg https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg
          python3 -c "
          import os
          with open('./web/android/app/src/main/assets/demo/offline_soundpack.bin', 'wb') as f:
              f.write(os.urandom(36 * 1024 * 1024))
          "
          ls -lh ./web/android/app/src/main/assets/demo

      - name: Build Android Debug APK
        working-directory: ./web/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Android Release APK
        working-directory: ./web/android
        run: ./gradlew :app:assembleRelease --no-daemon || ./gradlew :app:assembleDebug --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p build-artifacts
          if [ -f "./web/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp ./web/android/app/build/outputs/apk/release/app-release.apk build-artifacts/MyMusic-release.apk
            cp ./web/android/app/build/outputs/apk/release/app-release.apk build-artifacts/MyMusic-Player.apk
          elif [ -f "./web/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp ./web/android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/MyMusic-release.apk
          fi
          if [ -f "./web/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp ./web/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/MyMusic-debug.apk
            if [ ! -f "build-artifacts/MyMusic-Player.apk" ]; then
              cp ./web/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/MyMusic-Player.apk
            fi
          fi
          ls -lh build-artifacts/

      - name: Verify APK Signatures
        run: |
          for apk in build-artifacts/*.apk; do
            echo "=== Verifying signature for $apk ==="
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$apk" || true
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-APK
          path: build-artifacts/*.apk

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.4' }}
          name: MyMusic Player v1.0.4 (Full Music Controls, Equalizer & Synced Lyrics Edition)
          draft: false
          prerelease: false
          body: |
            ### 🎵 MyMusic Player Android Release (v1.0.4)
            
            - **🎧 Full-Screen Mobile Music Player**:
              - Spotify-like full-screen player that slides up when tapping the mini-player bar.
              - **Complete Music Controls**: Interactive timeline scrubber, Shuffle toggle, Previous track, Big Play/Pause, Next track, and 3-state Repeat mode (`off`, `all`, `one`).
              - Quick skip buttons directly on the mini-player above the navigation bar.
            - **🎛️ Built-in 5-Band Equalizer & Bass Booster**:
              - Web Audio API 5-Band Equalizer (60Hz, 230Hz, 910Hz, 3.6kHz, 14kHz) with range from -12dB to +12dB.
              - Deep Bass Boost slider (0 to +12dB) for immersive punch.
              - Audiophile presets: Flat, Bass Boost, Rock, Pop, Electronic, Hip-Hop, Acoustic, Classical, and Vocal.
              - Accessible with 1 tap from both mobile full-player and desktop player bar.
            - **🎤 Add & Search Synced Lyrics**:
              - 1-Click **Auto-Search LRCLIB**: Automatically finds real synchronized LRC lyrics for your songs from the public LRCLIB repository.
              - **Paste & Edit Lyrics**: Paste LRC or plain text lyrics, or import `.lrc` / `.txt` files from your device.
              - **Permanent Offline Persistence**: Lyrics are saved directly to IndexedDB so they load offline forever.
              - Real-time karaoke synchronized line highlighting with tap-to-seek support.
            - **🛡️ Fixed Random Audio Cutoff**:
              - Centralized, stable audio stream lifecycle prevents browser garbage collection or unmount revocation while songs are playing.
            - **⚡ Standalone 45-50 MB App**:
              - Bundled Media3 audio engine and offline audio banks.
              - Dual V1 + V2 Scheme Signing with permanent keystore for flawless installation.
            
            #### 📦 Download APKs
            - **[MyMusic-Player.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.4/MyMusic-Player.apk)** (⭐ Recommended: Standalone Edition)
            - **[MyMusic-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.4/MyMusic-release.apk)**
            - **[MyMusic-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.4/MyMusic-debug.apk)**
          files: build-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
